services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: capacity
      POSTGRES_PASSWORD: capacity
      POSTGRES_DB: capacity
    ports:
      # Host port defaults to 5433 so the stack does not collide with a
      # Postgres already running on the reviewer's machine. Override with
      # POSTGRES_HOST_PORT in .env if needed.
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U capacity -d capacity']
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    environment:
      # Single-node KRaft: the same process is broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Two client listeners: `kafka:9092` for containers on the compose
      # network, `localhost:29092` for scripts run from the host.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init; a typo in a topic name
      # should fail loudly, not spawn a new empty topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    ports:
      - '${KAFKA_HOST_PORT:-29092}:29092'
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list']
      interval: 5s
      timeout: 10s
      retries: 20

  # One-shot: creates the treasury topic, then exits 0.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic treasury.program-capacity
        --partitions 3 --replication-factor 1

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://capacity:capacity@postgres:5432/capacity
      FX_RATES: '{"EUR/USD":"1.0800","USD/EUR":"0.9259","GBP/USD":"1.2700","USD/GBP":"0.7874","JPY/USD":"0.0067","USD/JPY":"149.25"}'
      # Development-only credentials so the stack is usable out of the box.
      JWT_SECRET: dev-jwt-secret-change-me-please
      JWT_EXPIRES_IN: 1h
      API_CLIENT_ID: demo-client
      API_CLIENT_SECRET: demo-client-secret-change-me
    ports:
      - '${APP_HOST_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
